# Design capacity in mWh - set this to YOUR battery's design capacity.
# Wrong values skew WearPercent and EquivCycles. Read it from the battery
# label, or powercfg /batteryreport when it actually reports values.
DesignCapacity=44021
Design=true


# BatteryFullChargedCapacity (root\WMI)
Full=true

# BatteryStatus (root\WMI)
Remaining=true
Voltage=true
ChargeRate=true
DischargeRate=true
Charging=true
PowerOnline=false
Critical=false

# Win32_Battery (root\cimv2)
Chemistry=false
EstimatedChargeRemaining=false

# Computed (need an accurate DesignCapacity first; see config.md)
WearPercent=false
EquivCycles=false
