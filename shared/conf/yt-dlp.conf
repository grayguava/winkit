# yt-dlp configuration for mmu
# This file is passed via --config-location so yt-dlp ignores all other config files.

# Download best audio only
-f ba

# Extract audio from container
-x

# Keep original codec (no transcode)
--audio-format best

# Embed metadata (title, artist, album, etc.)
--embed-metadata

# Embed thumbnail as album art
--embed-thumbnail

# Single video, not a playlist
--no-playlist

# Windows-safe filenames (sanitize chars)
--windows-filenames

# Resume interrupted downloads
-c

# Suppress verbose output (ymdl prints its own messages)
--quiet
--no-warnings
